<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Bovaro</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #f7f7fb;
        color: #111827;
      }
      .card {
        max-width: 420px;
        margin: 24px;
        padding: 40px 32px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 28px;
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(135deg, #5b3df5, #0ea5a4);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 26px;
        font-weight: 700;
      }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: #5b6475; line-height: 1.6; margin: 0 0 20px; }
      button {
        border: 0;
        border-radius: 16px;
        background: #5b3df5;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 24px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">B</div>
      <h1>Du är offline</h1>
      <p>Bovaro behöver en internetanslutning. Kontrollera din uppkoppling och försök igen.</p>
      <button onclick="location.reload()">Försök igen</button>
    </div>
  </body>
</html>
